name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  GO_VERSION: '1.25'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verifikasi go.mod rapi
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "File berikut belum diformat:"
            gofmt -l .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: golangci-lint
        run: golangci-lint run

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: db_golang_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install golang-migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest

      - name: Jalankan migration
        run: |
          migrate -path db/migrations \
            -database "postgres://postgres:postgres_ci@127.0.0.1:5433/db_golang_test?sslmode=disable" up

      - name: Test
        env:
          POSTGRES_DB: db_golang_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci
          DB_HOST: 127.0.0.1
          DB_PORT: 5433
          DB_SSL: disable
          LOG_LEVEL: error
          LOG_FORMAT: json
        run: go test -race -coverprofile=coverage.out ./...

      - name: Ringkasan coverage
        run: go tool cover -func=coverage.out | tail -1

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - run: go build -v ./...